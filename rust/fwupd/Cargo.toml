[package]
name = "fwupd"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bitflags = "2"
flate2 = "1"
foreign-types-shared = "0.1"
libc = "0.2"
openssl = "0.10"
openssl-sys = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
